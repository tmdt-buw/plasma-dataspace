# ----------------------------------------
# Spring Boot Admin
# ----------------------------------------
logging.file.name=${plasma.logging.path}/${plasma.logging.all.file}.log
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
# ----------------------------------------
# Spring Docs
# ----------------------------------------
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api/${spring.application.name}/docs
springdoc.swagger-ui.path=/api/${spring.application.name}/swagger-ui
springdoc.swagger-ui.disable-swagger-default-url=true
# ----------------------------------------
# Spring
# ----------------------------------------
## General
spring.application.name=sms
server.port=8181
server.error.whitelabel.enabled=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# ----------------------------------------
# PLASMA
# ----------------------------------------
plasma.host_name=plasma-sms
plasma.server_address=http://${plasma.host_name}:${server.port}
## Logging
plasma.logging.path=./logs/sms_logs
plasma.logging.all.file=file_all
plasma.logging.all.level=INFO
## Technologies
plasma.maria.url=jdbc:mysql://localhost:3306/plasma-sms
plasma.maria.username=root
plasma.maria.password=plasma
## Service registration
plasma.registration.ping.interval=30000
# ----------------------------------------
# Database Settings
# ----------------------------------------
## JPA
spring.jpa.generate-ddl=true
spring.jpa.open-in-view=true
## Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.connection.charSet=UTF-8
## Spring Datasource
spring.datasource.username=${plasma.maria.username}
spring.datasource.password=${plasma.maria.password}
spring.datasource.url=${plasma.maria.url}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
plasma.config.local.path=/var/plasma/configs

# ----------------------------------------
# Copied from KGS
# ----------------------------------------
## Settings
de.buw.tmdt.plasma.services.kgs.scheduling.enabled=false
spring.jackson.mapper.accept-case-insensitive-enums=true
## Technologies
plasma.kgs.semanticmodels.store.url=http://localhost:3030/sm
plasma.kgs.ontologies.store.url=http://localhost:3030/ontologies
## Local ontology configuration
plasma.kgs.localontology.prefix=local
plasma.kgs.localontology.uri=https://local.ontology#
plasma.kgs.localontology.label=LOCAL
plasma.kgs.localontology.description=A local ontology maintained by this instance.

