services:
  ########################### Infrastructure ######################################
  fuseki:
    extends:
      service: fuseki
      file: docker-compose.local.yml

  mariadb-sms:
    extends:
      service: mariadb-sms
      file: docker-compose.local.yml

  ########################### Services ######################################
  sms-init:
    image: busybox
    volumes:
      - kgs_ontologies:/var/ontologies
    command: [ "sh", "-c", "chown -R 1000:1000 /var/ontologies" ]
    profiles: [ staging ]

  sms:
    extends:
      service: sms
      file: docker-compose.local.yml
    image: git.uni-wuppertal.de:4567/tmdt/projects/dataspaces/plasma/sms:${PLASMA_VERSION}
    depends_on:
      sms-init:
        condition: service_completed_successfully
      mariadb-sms:
        condition: service_started
      fuseki:
        condition: service_started
      traefik:
        condition: service_started

    volumes:
      - ./deploy/configs:/var/plasma/configs
      - ./deploy/ontologies:/var/ontologies
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sms.rule=Host(`${PLASMA_DEPLOY_HOSTNAME}`) && PathPrefix(`/api/sms`)"
      - "traefik.http.routers.sms.entrypoints=${PLASMA_DEPLOY_ENTRYPOINT}"
      - "traefik.http.routers.app-https.middlewares=cors"
      - "traefik.http.middlewares.cors.headers.accesscontrolallowmethods=*"
      - "traefik.http.middlewares.cors.headers.accesscontrolalloworiginlist=*"
      - "traefik.http.middlewares.cors.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.cors.headers.addvaryheader=true"

  dps:
    extends:
      service: dps
      file: docker-compose.local.yml
    image: git.uni-wuppertal.de:4567/tmdt/projects/dataspaces/plasma/dps:${PLASMA_VERSION}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dps.rule=Host(`${PLASMA_DEPLOY_HOSTNAME}`) && PathPrefix(`/api/dps`)"
      - "traefik.http.routers.dps.entrypoints=${PLASMA_DEPLOY_ENTRYPOINT}"
      - "traefik.http.routers.app-https.middlewares=cors"
      - "traefik.http.middlewares.cors.headers.accesscontrolallowmethods=*"
      - "traefik.http.middlewares.cors.headers.accesscontrolalloworiginlist=*"
      - "traefik.http.middlewares.cors.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.cors.headers.addvaryheader=true"

  frontend:
    extends:
      service: frontend
      file: docker-compose.local.yml
    image: git.uni-wuppertal.de:4567/tmdt/projects/dataspaces/plasma/frontend:${PLASMA_VERSION}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${PLASMA_DEPLOY_HOSTNAME}`)"
      - "traefik.http.routers.frontend.entrypoints=${PLASMA_DEPLOY_ENTRYPOINT}"
      - "traefik.http.routers.frontend.tls.certresolver=plasmaresolver"

  ########################### Auxiliary Services ######################################

#  ars-l-lm:
#    extends:
#      service: ars-l-lm
#      file: docker-compose.local.yml
#    image: git.uni-wuppertal.de:4567/tmdt/projects/dataspaces/plasma/ars-l-lm:${PLASMA_VERSION}

  ars-r-sr:
    extends:
      service: ars-r-sr
      file: docker-compose.local.yml
    image: git.uni-wuppertal.de:4567/tmdt/projects/dataspaces/plasma/ars-r-sr:${PLASMA_VERSION}

  ########################### External Services ######################################

  traefik:
    extends:
      service: traefik
      file: docker-compose.local.yml
    command:
      - --api.dashboard=true
      - --log.level=DEBUG
      #- --log.filepath=/var/log/traefik.log
      - --accesslog=true
      #- --accesslog.filepath=/var/log/traefik-access.log
      - --providers.docker.network=plasma
      - --providers.docker.exposedByDefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entryPoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # remove next line when using Traefik v2
      - --entrypoints.websecure.asDefault=true
      - --entrypoints.websecure.http.tls.certresolver=plasmaresolver
      - --certificatesresolvers.plasmaresolver.acme.tlschallenge=true
      - --certificatesresolvers.plasmaresolver.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.plasmaresolver.acme.email=paulus@uni-wuppertal.de
      - --certificatesresolvers.plasmaresolver.acme.storage=/letsencrypt/acme.json

    volumes:
    - /letsencrypt:/letsencrypt
    - ./traefik/default.yml:/dynamic.yml:ro  # Mount the dynamic configuration file

volumes:
  fuseki_data:
  mariadb_sms:

networks:
  plasma:
    name: plasma
