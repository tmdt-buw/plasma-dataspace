services:
  ########################### Infrastructure ######################################
  fuseki:
    extends:
      service: fuseki
      file: docker-compose.local.yml

  mariadb-sms:
    extends:
      service: mariadb-sms
      file: docker-compose.local.yml

  ########################### Services ######################################
  sms:
    extends:
      service: sms
      file: docker-compose.local.yml
    image: git.uni-wuppertal.de:4567/tmdt/projects/dataspace/plasma/sms:${PLASMA_VERSION}

  dps:
    extends:
      service: dps
      file: docker-compose.local.yml
    image: git.uni-wuppertal.de:4567/tmdt/projects/dataspace/plasma/dps:${PLASMA_VERSION}

  frontend:
    extends:
      service: frontend
      file: docker-compose.local.yml
    image: git.uni-wuppertal.de:4567/tmdt/projects/dataspace/plasma/frontend:${PLASMA_VERSION}

  ########################### Auxiliary Services ######################################

#  ars-l-lm:
#    extends:
#      service: ars-l-lm
#      file: docker-compose.local.yml
#    image: git.uni-wuppertal.de:4567/tmdt/projects/dataspace/plasma/ars-l-lm:${PLASMA_VERSION}

  ars-r-sr:
    extends:
      service: ars-r-sr
      file: docker-compose.local.yml
    image: git.uni-wuppertal.de:4567/tmdt/projects/dataspace/plasma/ars-r-sr:${PLASMA_VERSION}

  ########################### External Services ######################################

  traefik:
    extends:
      service: traefik
      file: docker-compose.local.yml
    command:
      - --api.dashboard=true
      - --log.level=DEBUG
      #- --log.filepath=/var/log/traefik.log
      - --accesslog=true
      #- --accesslog.filepath=/var/log/traefik-access.log
      - --providers.docker.network=plasma
      - --providers.docker.exposedByDefault=false
      - --entrypoints.web.address=:80
      #- --entrypoints.web.http.redirections.entrypoint.to=websecure
      #- --entryPoints.web.http.redirections.entrypoint.scheme=https
      #- --entrypoints.websecure.address=:443
      # remove next line when using Traefik v2
      #- --entrypoints.websecure.asDefault=true
      #- --entrypoints.websecure.http.tls.certresolver=myresolver
      #- --certificatesresolvers.myresolver.acme.tlschallenge=true
      #- --certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web
      #- --certificatesresolvers.myresolver.acme.email=paulus@crafting-systems.de
      #- --certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json

volumes:
  fuseki_data:
  mariadb_sms:
  configs:
  kgs_ontologies:
  dps_storage:

networks:
  plasma:
    name: plasma