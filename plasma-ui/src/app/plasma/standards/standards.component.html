<div class="mcontainer" fxLayout.lt-sm fxLayout="column" fxLayoutGap="10px" fxLayoutAlign="center start">
  <mat-card fxFlex="90" fxFill  style="margin-bottom: 20px;">
    <mat-card-header>Define Standard</mat-card-header>
    <mat-card-content fxFill>
      <label style="margin-left: 20px">Name</label>
      <input type="text" [(ngModel)]="standardName" placeholder="Name" style="margin-left: 10px">
      <label style="margin-left: 20px">Description</label>
      <input type="text" [(ngModel)]="standardDescription" placeholder="Description" style="margin-left: 10px">
    </mat-card-content>
  </mat-card>

  <mat-card fxFlex="90" fxFill style="margin-bottom: 20px;">
    <mat-card-header>Add Entity Rules</mat-card-header>
    <mat-card-content fxFill>
      <form>
        <section *ngFor="let entityConcept of entityConcepts; let i = index;">
          <label style="margin-left: 20px">Attribute Name</label>
          <input type="text" [(ngModel)]="entityConcept.originalAttribute" name="originalAttribute_{{i}}" style="margin-left: 10px">
          <label style="margin-left: 20px">Concept Name</label>
          <input type="text" [(ngModel)]="entityConcept.conceptName" name="conceptName_{{i}}" style="margin-left: 10px">
          <label style="margin-left: 20px">Concept Description</label>
          <input type="text" [(ngModel)]="entityConcept.conceptDescription" name="conceptDescription_{{i}}" style="margin-left: 10px">
          <label style="margin-left: 20px">Required Predecessor</label>
          <input type="text" [(ngModel)]="entityConcept.requiredPredecessor" name="requiredPredecessor_{{i}}" style="margin-left: 10px">
          <button type="button" (click)="deleteEntityConcept(i)" *ngIf="i>0" style="margin-left: 10px"><i class="fa fa-minus-square"></i></button>
          <button type="button" (click)="addEntityConcept()" style="margin-left: 10px" *ngIf="entityConcepts.length === i+1"><i class="fa fa-plus-square"></i></button>
        </section>

      </form>
    </mat-card-content>
  </mat-card>

  <mat-card fxFlex="90" fxFill style="margin-bottom: 20px;">
    <mat-card-header>Add Relation Rules</mat-card-header>
    <mat-card-content fxFill>
      <form>
        <section *ngFor="let relationConcept of relationConcepts; let i = index;">
          <label style="margin-left: 20px">Relation Name</label>
          <input type="text" [(ngModel)]="relationConcept.conceptName" name="name_{{i}}" style="margin-left: 10px">
          <label style="margin-left: 20px">Relation Description</label>
          <input type="text" [(ngModel)]="relationConcept.conceptDescription" name="description_{{i}}" style="margin-left: 10px">
          <label style="margin-left: 20px">From Entity</label>
          <input type="text" [(ngModel)]="relationConcept.fromConcept" name="fromEntityName_{{i}}" style="margin-left: 10px">
          <label style="margin-left: 20px">To Entity</label>
          <input type="text" [(ngModel)]="relationConcept.toConcept" name="toEntityName_{{i}}" style="margin-left: 10px">
          <button type="button" (click)="deleteRelationConcept(i)" *ngIf="i>0" style="margin-left: 10px"><i class="fa fa-minus-square"></i></button>
          <button type="button" (click)="addRelationConcept()" style="margin-left: 10px" *ngIf="relationConcepts.length === i+1"><i class="fa fa-plus-square"></i></button>
        </section>

      </form>
      <button (click)="saveStandard()" class="btn btn-primary">Save Standard</button>
      <label for="file" class="btn btn-primary" style="margin-top: 8px; margin-left: 20px">Select Rule File</label>
      <input id="file" type="file" (change)="onFileChanged($event)" #fileInput label="XYZ" style="visibility: hidden">
    </mat-card-content>
  </mat-card>
</div>
