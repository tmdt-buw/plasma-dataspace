variables:
  CI_PROFILES: production

ui-lint:
  stage: verification
  allow_failure: true
  tags:
    - docker
  image: node:lts-stretch
  before_script:
    - cd frontend
    - npm install
  script:
    - npm run lint

ui-build:
  stage: build
  tags:
    - docker
  image: node:lts-stretch
  before_script:
    - cd frontend
    - npm install
  script:
    - npm run build:common
    - npm run build:dss
    - npm run build:dms
    - npm run build:sas
    - npm run build
  artifacts:
    expire_in: 30 days
    paths:
      - frontend/dist

ui-dockerize:
  stage: docker_deploy
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  tags:
    - docker
  only:
    - tags
  before_script:
    - VERSION=${CI_COMMIT_TAG#release-}
  script:
    - cd frontend
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - >
      for CORPID in $CI_PROFILES; do
        /kaniko/executor --build-arg profile=$CORPID --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/frontend/Dockerfile --destination $CI_REGISTRY_IMAGE/frontend:$VERSION-$CORPID
      done
  except: #equivalent to /^(?!release-).*$/ the longer version is needed since negative look-ahead is deactivated because of catastrophic backtracking
    - /^((.{0,7}$)|[^r]|.{1}[^e]|.{2}[^l]|.{3}[^e]|.{4}[^a]|.{5}[^s]|.{6}[^e]|.{7}[^-]).*$/