variables:
  CI_PROFILES: production

ui-lint:
  stage: verification
  allow_failure: true
  tags:
    - docker
  image: node:lts-stretch
  before_script:
    - cd frontend
    - npm install
  script:
    - npm run lint

ui-build:
  stage: build
  tags:
    - docker
  image: node:lts-stretch
  before_script:
    - cd frontend
    - npm install
  script:
    - npm run build
  artifacts:
    expire_in: 30 days
    paths:
      - frontend/dist

ui-dockerize:
  stage: docker_deploy
  image: docker:latest
  services:
    - docker:dind
  tags:
    - docker
  only:
    - tags
  before_script:
    - VERSION=${CI_COMMIT_TAG#release-}
  script:
    - cd frontend
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - >
      for CORPID in $CI_PROFILES; do
        docker build --build-arg profile=$CORPID --build-arg CI_JOB_TOKEN=$CI_JOB_TOKEN -t $CI_REGISTRY_IMAGE/frontend:$VERSION-$CORPID .
        docker push $CI_REGISTRY_IMAGE/frontend:$VERSION-$CORPID
      done
  except: #equivalent to /^(?!release-).*$/ the longer version is needed since negative look-ahead is deactivated because of catastrophic backtracking
    - /^((.{0,7}$)|[^r]|.{1}[^e]|.{2}[^l]|.{3}[^e]|.{4}[^a]|.{5}[^s]|.{6}[^e]|.{7}[^-]).*$/