stages:
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  CI_PROFILES: production

ui-dockerize on release:
  extends: ui-dockerize
  when: on_success
  only:
    - tags

ui-lint:
  stage: test
  allow_failure: true
  tags:
    - docker
  image: node:lts-stretch
  before_script:
    - cd plasma-ui
    - npm install
  script:
    - npm run lint


ui-build:
  stage: build
  tags:
    - docker
  image: node:lts-stretch
  before_script:
    - cd plasma-ui
    - npm install
  script:
    - npm run build
  artifacts:
    expire_in: 30 days
    paths:
      - plasma-ui/dist


ui-dockerize:
  stage: deploy
  when: manual
  tags:
    - docker
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - export MY_TAG=$CI_COMMIT_TAG
    - >
      if [ -z "$MY_TAG" ];
      then
        MY_TAG=$CI_COMMIT_SHORT_SHA
      else
        echo $MY_TAG
      fi
  script:
    - cd plasma-ui
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - >
      for CORPID in $CI_PROFILES; do
        docker build --build-arg profile=$CORPID --build-arg CI_JOB_TOKEN=$CI_JOB_TOKEN -t $CI_REGISTRY_IMAGE/plasma-ui:$MY_TAG-$CORPID .
        docker push $CI_REGISTRY_IMAGE/plasma-ui:$MY_TAG-$CORPID
      done
