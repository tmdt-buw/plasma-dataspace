name: Build and publish PLASMA images

on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
      - "release-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plasma-images-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_METADATA_SHORT_SHA_LENGTH: 12

jobs:
  build-java:
    name: Compile Java services
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^(v|release-)[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected v1.2.3 or release-1.2.3, got: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          architecture: x64
          cache: maven
          cache-dependency-path: "**/pom.xml"

      - name: Set up Python for recommendation tests
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install recommendation test dependencies
        run: python -m pip install -r auxiliary_services/ARS-R-statistic-recommender/requirements-test.txt

      - name: Verify Java services and recommendation integration
        run: ./scripts/test-integration.sh

  publish-java:
    name: Publish ${{ matrix.name }}
    needs: build-java
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SMS
            service: sms
            module: components/semantic-modeling-service/service
            image: son1i/plasma-sms
          - name: DPS
            service: dps
            module: components/data-processing-service/service
            image: son1i/plasma-dps

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          architecture: x64
          cache: maven
          cache-dependency-path: "**/pom.xml"

      - name: Restore Jib cache
        uses: actions/cache@v5
        with:
          path: .jib-cache/${{ matrix.service }}
          key: jib-${{ runner.os }}-${{ runner.arch }}-${{ matrix.service }}-${{ github.sha }}
          restore-keys: |
            jib-${{ runner.os }}-${{ runner.arch }}-${{ matrix.service }}-

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=ref,event=branch,priority=1000
            type=match,pattern=^(?:v|release-)([0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)$,group=1,priority=900
            type=sha,prefix=sha-,format=short,priority=100

      - name: Prepare Jib tags
        id: jib
        shell: bash
        env:
          GENERATED_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          mapfile -t refs < <(printf '%s\n' "${GENERATED_TAGS}" | sed '/^[[:space:]]*$/d')

          if (( ${#refs[@]} == 0 )); then
            echo "No Docker tags generated" >&2
            exit 1
          fi

          tag_names=()
          for ref in "${refs[@]}"; do
            tag_names+=("${ref##*:}")
          done

          echo "primary=${tag_names[0]}" >> "${GITHUB_OUTPUT}"
          if (( ${#tag_names[@]} > 1 )); then
            additional="$(IFS=,; echo "${tag_names[*]:1}")"
            echo "additional=${additional}" >> "${GITHUB_OUTPUT}"
          else
            echo "additional=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set Maven release version
        if: github.ref_type == 'tag'
        run: >-
          mvn --batch-mode --no-transfer-progress
          versions:set
          -DnewVersion=${{ steps.jib.outputs.primary }}
          -DgenerateBackupPoms=false

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push with Jib
        shell: bash
        env:
          MODULE: ${{ matrix.module }}
          IMAGE: ${{ matrix.image }}
          SERVICE: ${{ matrix.service }}
          PRIMARY_TAG: ${{ steps.jib.outputs.primary }}
          ADDITIONAL_TAGS: ${{ steps.jib.outputs.additional }}
        run: |
          set -euo pipefail
          jib_args=(
            "-Djib.to.image=docker.io/${IMAGE}:${PRIMARY_TAG}"
            "-Djib.applicationCache=${GITHUB_WORKSPACE}/.jib-cache/${SERVICE}"
            "-Djib.container.creationTime=EPOCH"
            "-Djib.console=plain"
          )

          if [[ -n "${ADDITIONAL_TAGS}" ]]; then
            jib_args+=("-Djib.to.tags=${ADDITIONAL_TAGS}")
          fi

          mvn --batch-mode --no-transfer-progress \
            -DskipTests \
            -pl "${MODULE}" \
            -am \
            package jib:build \
            "${jib_args[@]}"

  publish-frontend:
    name: Build and publish frontend
    needs: build-java
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: son1i/plasma-frontend
          flavor: latest=false
          tags: |
            type=ref,event=branch,priority=1000
            type=match,pattern=^(?:v|release-)([0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)$,group=1,priority=900
            type=sha,prefix=sha-,format=short,priority=100

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test application and modeling UI in Chrome
        working-directory: frontend
        run: |
          npm ci
          npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and optionally push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PLASMA_VERSION=${{ steps.meta.outputs.version }}
            PLASMA_BASE_HREF=/plasma/
            PLASMA_API_BASE_URL=/plasma
          cache-from: type=gha,scope=plasma-frontend
          cache-to: type=gha,mode=max,scope=plasma-frontend
          provenance: mode=max
          sbom: true
