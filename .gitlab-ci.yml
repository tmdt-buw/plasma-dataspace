variables:
  # Improve performance with overlayFS.
  DOCKER_DRIVER: overlay2
  # Disable TLS compatibility for DinD 19.03+
  DOCKER_TLS_CERTDIR: ""

stages:
  - verification
  - test
  - integration_test
  - build
  - artifact_deploy
  - docker_deploy

include:
  - local: '.gitlab-ci-java.yml'
  - local: '.gitlab-ci-ui.yml'
