<div class="content" fxLayout="column" fxLayoutGap="30px">

  <div class="content-header" fxLayout="row" fxLayoutAlign="space-between start" fxLayoutGap="15px">
    <div fxLayout="column">
      <span class="mat-h1">
        Data sources
      </span>
      Manage your data sources. You can add a new data source or remove existing data sources.
    </div>
    <span class="content-header-button">
      <button mat-raised-button color="primary" (click)="addDataSource()">
      <mat-icon>add</mat-icon>
      <span>New data source</span>
    </button>
    </span>
  </div>

  <pls-data-sources [$refresh]="$refresh" [dataSourcesRoute]="routes.DATA_SOURCES" [schemaAnalysisRoute]="routes.SCHEMA_ANALYSIS" [modelingRoute]="routes.MODELING" [fwdNavigation]="fwdNavigation"></pls-data-sources>

</div>
