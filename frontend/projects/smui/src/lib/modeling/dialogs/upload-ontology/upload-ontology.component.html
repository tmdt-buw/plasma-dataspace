<div fxLayout="column" fxLayoutGap="10px">

  <form [formGroup]="form" fxLayout="column" nz-form>

    <nz-form-item>
      <nz-form-label [nzSpan]="5" nzFor="label" nzRequired>Label</nz-form-label>
      <nz-form-control nzErrorTip="The label has to have between 2 and 6 characters"
                       nzExtra="A short but meaningful label to denote this ontology">
        <input formControlName="label" id="label" nz-input/>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label [nzSpan]="5" nzFor="uri" nzRequired>URI</nz-form-label>
      <nz-form-control nzErrorTip="The URI is required." nzExtra="URI of the concept from an ontology">
        <input formControlName="uri" id="uri" nz-input/>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label [nzSpan]="5" nzFor="prefix" nzRequired>Prefix</nz-form-label>
      <nz-form-control nzErrorTip="A valid prefix is required and needs to have between 2 and 6 characters."
                       nzExtra="The default prefix used in this ontology">
        <input formControlName="prefix" id="prefix" nz-input/>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label [nzSpan]="5" nzFor="description">Description</nz-form-label>
      <nz-form-control nzExtra="A short description">
        <input formControlName="description" id="description" nz-input/>
      </nz-form-control>
    </nz-form-item>
  </form>

  <!--suppress AngularInvalidExpressionResultType --> <!-- It actually is a File object that is returned -->
  <nz-upload
    [(nzFileList)]="ontologyFiles"
    [nzBeforeUpload]="beforeUpload"
    [nzMultiple]="false"
    nzType="drag"
  >
    <p class="ant-upload-drag-icon">
      <i nz-icon nzType="inbox"></i>
    </p>
    <p class="ant-upload-text">Click or drag ontology file to this area to upload</p>
    <p class="ant-upload-hint">
      Only OWL ontologies in Turtle (TTL) format are currently supported!
    </p>
  </nz-upload>

  <!-- error success and submit button -->
  <div fxLayout="column" fxLayoutAlign="space-between" fxLayoutGap="5px">
    <nz-alert *ngIf="error" nzMessage="{{error.message}}" nzType="error"></nz-alert>
    <nz-alert *ngIf="success" nzCloseable="true" nzMessage="{{success}}" nzType="success"></nz-alert>
    <div fxLayoutAlign="end center">
      <button (click)="onSubmit()" *ngIf="!uploading" [disabled]="!isValid()" nz-button nz-tooltip
              nzTooltipTitle="Add ontology" nzType="primary">
        <i nz-icon nzType="upload"></i>Add ontology
      </button>
      <button *ngIf="uploading" [disabled]="true" nz-button nz-tooltip nzTooltipTitle="Uploading ontology"
              nzType="primary">
        <i nz-icon nzType="upload"></i>Uploading...
      </button>
    </div>

  </div>
</div>
