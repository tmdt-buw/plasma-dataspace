<div fxFlex fxLayout="row" fxLayoutAlign="start start" fxLayoutGap="20px">
  <nz-list nzBordered>
    <nz-list-item
      (click)="selectService(service)"
      *ngFor="let service of serviceList"
      [ngStyle]="{'background': isSelected(service) ? 'lightgrey' : null}"
    >
      <ng-container *ngIf="serviceIsPreferred(service.uuid); then preferredLabel; else serviceLabel">
      </ng-container>
      <ng-template #preferredLabel>
        <i class="dropdown-icon" nz-icon nzType="star"></i>
      </ng-template>
      <ng-template #serviceLabel>
        <i class="dropdown-icon" nz-icon nzType="node-index"></i>
      </ng-template>
      {{ service.serviceName }}
    </nz-list-item>
  </nz-list>
  <div *ngIf="selected" fxFill fxFlex fxLayout="column" fxLayoutAlign="start start">
    <div fxFlex fxLayout="column" fxLayoutAlign="start start">
      <nz-descriptions [nzColumn]="1" nzTitle="Service Information">
        <nz-descriptions-item nzTitle="Name">{{ selected.serviceName }}</nz-descriptions-item>
        <nz-descriptions-item nzTitle="UUID">{{ selected.uuid }}</nz-descriptions-item>
        <nz-descriptions-item nzTitle="Type">{{ selected.recommendationType }}</nz-descriptions-item>
        <nz-descriptions-item nzTitle="Description">{{ selected.description }}</nz-descriptions-item>
      </nz-descriptions>
      <ng-container *ngIf="serviceIsPreferred(selected.uuid); then removeButton; else addButton">

      </ng-container>
      <ng-template #addButton>
        <button (click)="addServiceToPreferred(selected)" *ngIf="selected" nz-button
                nzType="primary">
          <i nz-icon nzType="star"></i>Add to preferred Services
        </button>
      </ng-template>
      <ng-template #removeButton>
        <button (click)="removeServiceFromPreferred(selected)" *ngIf="selected" nz-button
                nzType="primary">
          <i nz-icon nzType="delete"></i>Remove from preferred Services
        </button>
      </ng-template>
    </div>
  </div>
</div>
