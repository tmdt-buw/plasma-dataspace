<div fxFlex fxLayout="row" fxLayoutAlign="start start" fxLayoutGap="20px">

  <nz-list nzBordered>
    <nz-list-item (click)="selectOntology(ont)" *ngFor="let ont of availableOntologies" [ngStyle]="{'background': isSelected(ont) ? 'lightgrey' : null, 'color': isSelected(ont) ? 'white' : null}">
      <span nz-typography>{{ ont.label }} ({{ ont.uri }})</span>
    </nz-list-item>
  </nz-list>
  <div *ngIf="selected" fxFill fxFlex fxLayout="column" fxLayoutAlign="start start">
    <div fxFlex fxLayout="column" fxLayoutAlign="start start">
      <nz-descriptions [nzColumn]="1" nzTitle="Ontology Information">
        <nz-descriptions-item nzTitle="Label" nzType="secondary">{{ selected.label }}</nz-descriptions-item>
        <nz-descriptions-item nzTitle="URI">{{ selected.uri }}</nz-descriptions-item>
        <nz-descriptions-item nzTitle="Prefix">{{ selected.prefix }}</nz-descriptions-item>
        <nz-descriptions-item nzTitle="# Classes">{{ selected.noClasses }}</nz-descriptions-item>
        <nz-descriptions-item nzTitle="# Properties">
          {{ selected.noProperties }}
        </nz-descriptions-item>
      </nz-descriptions>
      <span>{{ selected.description }}</span>
    </div>

  </div>

  <div *ngIf="!selected" fxFill fxFlex fxLayout="column" fxLayoutAlign="start start">
    <p>Please select an ontology from the list or upload a new one.</p>
  </div>

  <div fxFill fxFlex="170px" fxLayout="column" fxLayoutAlign="space-between center">
    <button (click)="showUploadOntologiesDialog()" nz-button nzType="primary"><i nz-icon nzType="upload"></i>Upload ontology</button>
    <div></div>
    <button (nzOnConfirm)="deleteOntology(selected)" *ngIf="selected" [disabled]="selected.local" nz-button nz-popconfirm="This operation cannot be undone."
            nzDanger
            nzPopconfirmPlacement="topLeft"
            nzPopconfirmTitle="Are you sure to delete this ontology?"
            nzType="default"><i nz-icon nzType="delete"></i>Delete selected ontology
    </button>


  </div>
