<div class="table-container mat-elevation-z4">

  <div class="loading-shade" *ngIf="isLoading || error">
    <mat-spinner *ngIf="isLoading" [diameter]="40"></mat-spinner>
    <div class="error" *ngIf="error">
      {{ error.message }}
    </div>
  </div>

  <mat-table [dataSource]="this.dataSources" matSort>
    <ng-container matColumnDef="title">
      <mat-header-cell *matHeaderCellDef mat-sort-header fxFlex="30"> Title</mat-header-cell>
      <mat-cell *matCellDef="let element" fxFlex="30"> {{element.title}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="description">
      <mat-header-cell *matHeaderCellDef mat-sort-header fxFlex="60"> Description</mat-header-cell>
      <mat-cell *matCellDef="let element" fxFlex> {{element.description}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="operations">
      <mat-header-cell *matHeaderCellDef fxFlex="180px"></mat-header-cell>
      <mat-cell *matCellDef="let element" fxFlex="180px" align="end">
        <button mat-icon-button (click)="showDataSourceLongDescription(element)" matTooltip="Info">
          <mat-icon>info</mat-icon>
        </button>
        <button mat-icon-button color="primary" matTooltip="Schema analysis" *ngIf="schemaAnalysisRoute" (click)="navigateToEditor(element, schemaAnalysisRoute)">
          <mat-icon>graphic_eq</mat-icon>
        </button>
        <button mat-icon-button color="primary" matTooltip="Modeling" *ngIf="modelingRoute" (click)="navigateToEditor(element, modelingRoute)">
          <mat-icon>widgets</mat-icon>
        </button>
        <button mat-icon-button [matMenuTriggerFor]="dataSourceMenu" [matMenuTriggerData]="element">
          <mat-icon>more_vert</mat-icon>
        </button>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
  </mat-table>

  <div *ngIf="this.dataSources.data.length < 1 && !isLoading" fxLayout="row" fxLayoutAlign="center center" class="no-sources">
    No data sources found.
  </div>
</div>

<mat-menu #dataSourceMenu="matMenu">
  <ng-template matMenuContent let-element="element">
    <button mat-menu-item (click)="deleteDataSource(element)">
      <mat-icon>delete</mat-icon> Delete
    </button>
  </ng-template>
</mat-menu>
