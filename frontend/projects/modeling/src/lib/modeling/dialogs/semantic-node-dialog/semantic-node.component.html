<p nz-tooltip
   [nzTooltipTitle]="'Concept description as defined by the knowledge source'">{{ data.node.concept.description }}</p>
<nz-divider></nz-divider>
<div fxLayout="row" fxLayoutAlign="space-between center">
  <pls-inline-edit [(ngModel)]="data.node.label" nz-tooltip [nzTooltipTitle]="'Chosen name for this entity'"
                   [$edit]="$edit"></pls-inline-edit>
  <div>
    <button nz-button nzType="text" nzShape="circle" *ngIf="!editing" (click)="startEdit()"><i nz-icon
                                                                                               nzType="edit"></i>
    </button>
    <button nz-button nzType="text" nzShape="circle" *ngIf="editing" (click)="acceptEdit()"><i nz-icon
                                                                                               nzType="check"></i>
    </button>
    <button nz-button nzType="text" nzShape="circle" *ngIf="editing" (click)="cancelEdit()"><i nz-icon
                                                                                               nzType="close"></i>
    </button>
  </div>
</div>
<i nz-typography nzType="secondary" nz-tooltip
   [nzTooltipTitle]="'Original label of the connected syntax node'">({{ data.node.originalLabel }})</i>
<pls-inline-edit [type]="'textarea'" [(ngModel)]="data.node.description" [$edit]="$edit"
                 [empty]="'No description'"></pls-inline-edit>

<div *ngIf="data.recommendations" fxLayout="column" fxLayoutAlign="space-between start" fxLayoutGap="10px">
  <nz-divider></nz-divider>
  <p [nzTooltipTitle]="'Recommended model extensions related to this node'" nz-tooltip>Extensions</p>
  <div (mouseenter)="showRecommendation(recommendation)" (mouseleave)="hideRecommendation()"
       *ngFor="let recommendation of data.recommendations" class="recommendation-box" fxLayout="row"
       fxLayoutAlign="space-between center" fxLayoutGap="5px">
    <span nz-typography> {{data.node.concept.label}}
      <i nz-icon nz-typography nzType="right"></i>
      {{recommendation.relations[0].concept.label}}
      <i nz-icon nz-typography nzType="right"></i>
      {{ recommendation.entities[0].concept.label }}</span>
    <div fxLayout="row" fxLayoutAlign="end" fxLayoutGap="5px">
      <button nz-button nzType="default" (click)="acceptRecommendation(recommendation)">
        <i nz-icon nz-typography
           class="green-icon" nzType="check"></i>
      </button>
      <!--      <i (click)="rejectRecommendation(recommendation)" nz-typography nz-icon-->
      <!--         nzType="close"></i>-->
    </div>
  </div>
</div>
