<p nz-tooltip
   [nzTooltipTitle]="'Concept description as defined by the knowledge source'">{{ data.node.concept.description }}</p>
<nz-divider></nz-divider>
<div fxLayout="row" fxLayoutAlign="space-between center">
  <pls-inline-edit [(ngModel)]="data.node.label" nz-tooltip [nzTooltipTitle]="'Chosen name for this entity'"
                   [$edit]="$edit"></pls-inline-edit>
  <div>
    <button nz-button nzType="text" nzShape="circle" *ngIf="!editing" (click)="startEdit()"><i nz-icon
                                                                                               nzType="edit"></i>
    </button>
    <button nz-button nzType="text" nzShape="circle" *ngIf="editing" (click)="acceptEdit()"><i nz-icon
                                                                                               nzType="check"></i>
    </button>
    <button nz-button nzType="text" nzShape="circle" *ngIf="editing" (click)="cancelEdit()"><i nz-icon
                                                                                               nzType="close"></i>
    </button>
  </div>
</div>
<i nz-typography nzType="secondary" nz-tooltip
   [nzTooltipTitle]="'Original label of the connected syntax node'">({{ data.node.originalLabel }})</i>
<pls-inline-edit [type]="'textarea'" [(ngModel)]="data.node.description" [$edit]="$edit"
                 [empty]="'No description'"></pls-inline-edit>
