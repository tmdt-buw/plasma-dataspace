<form nz-form [formGroup]="form" (submit)="submit()" fxLayout="column">

  <nz-form-item>
    <nz-form-label [nzSpan]="3" nzRequired nzFor="type">Type</nz-form-label>
    <nz-radio-group formControlName="type" [(ngModel)]="relationType" [nzDisabled]="!!editRelation" fxLayoutAlign="start center">
      <label nz-radio [nz-tooltip]="'Creates a relation that can be used to link classes or named entities.'" nzValue="ObjectProperty">ObjectProperty</label>
      <label nz-radio [nz-tooltip]="'Creates a relation that can be used to add (string) literals to existing classes or named entities.'" nzValue="DataProperty">DatatypeProperty</label>
    </nz-radio-group>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label [nzSpan]="3" nzRequired nzFor="label">Label</nz-form-label>
    <nz-form-control nzErrorTip="Label is required"
                     nzExtra="This will identify the concept in multiple modelings, so it should be independent from your current data.">
      <input nz-input formControlName="label" (change)="onLabelEdited($event)"/>
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label [nzSpan]="3" nzRequired nzFor="description">Description</nz-form-label>
    <nz-form-control nzErrorTip="Description is required"
                     nzExtra="Detailed description of the entity concept.">
      <textarea nz-input [nzAutosize]="{ minRows: 3}" formControlName="description"></textarea>
    </nz-form-control>
  </nz-form-item>


  <span *ngIf="uriwarn" nz-typography nzType="warning">If URI is changed, the existing relation will be updated!</span>
  <nz-form-item fxFlex>
    <nz-form-label [nzSpan]="3" nzRequired nzFor="uri">URI</nz-form-label>
    <nz-form-control
    [nzErrorTip]="urierror"
      [nzValidatingTip]="'Validating...'"
    [nzValidateStatus]="uriCheckStatus">
      <pls-uri-generator #uri_generator [uri]="editRelation?.uri" [identifierUpdate]="identifier" [namespaces]="namespaces" [disableAutoGeneration]="!!editRelation" (URIChanged)="updateURI($event)"></pls-uri-generator>
    </nz-form-control>

  </nz-form-item>

</form>

<div fxLayout="column" fxLayoutGap="5px">
  <nz-alert nzType="error" *ngIf="error">{{ error }}</nz-alert>
  <div fxLayout="row" fxLayoutGap="5px" fxLayoutAlign="end">
    <button nz-button (click)="cancel()">Cancel</button>
    <button (click)="submit()"
            [disabled]="!form.valid"
            nz-button nzType="primary">Save
    </button>
  </div>
</div>
