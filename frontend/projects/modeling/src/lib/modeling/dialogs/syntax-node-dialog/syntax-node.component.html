<p *ngIf="data.label == 'ROOT'">The ROOT node is the beginning syntax node of your data source. It cannot be mapped</p>
<i *ngIf="data.label != 'ROOT'">No description</i>
<div *ngIf="data.examples">
  <nz-divider></nz-divider>
  <h4 nz-typography>Example values</h4>
  <div *ngFor="let example of data.examples; let i = index" fxLayout="column" fxLayoutGap="10px">
    <nz-divider *ngIf="10 > i > 1"></nz-divider>
    <span *ngIf="10 > i > 0">{{ example }}</span>
    <span></span>
  </div>
</div>
