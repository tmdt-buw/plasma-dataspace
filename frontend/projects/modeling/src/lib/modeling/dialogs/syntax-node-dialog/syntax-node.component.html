<h2 mat-dialog-title fxLayout="row" fxLayoutAlign="space-between center" fxLayoutGap="15px" class="dialog-header">{{ data.node.label }} <mat-icon class="close-icon" [mat-dialog-close]="true">close</mat-icon></h2>
<mat-dialog-content fxLayout="column" fxLayoutGap="15px">
  <mat-divider></mat-divider>
  <p *ngIf="data.node.label == 'ROOT'">The ROOT node is the beginning syntax node of
    your data source. It cannot be mapped</p>
  <i *ngIf="data.node.label != 'ROOT'">No description</i>
  <div *ngIf="data.node.examples">
    <mat-divider></mat-divider>
    <h4>Example values</h4>
    <div *ngFor="let example of data.node.examples; let i = index" fxLayout="column" fxLayoutGap="10px">
      <mat-divider *ngIf="10 > i > 1"></mat-divider>
      <span *ngIf="10 > i > 0">{{ example }}</span>
      <span></span>
    </div>
  </div>
</mat-dialog-content>
