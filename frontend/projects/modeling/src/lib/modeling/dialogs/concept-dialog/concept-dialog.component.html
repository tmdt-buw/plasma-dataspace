<nz-tabset (nzSelectChange)="onIndexChange($event)">
  <nz-tab nzTitle="Concepts">
    <div fxLayout="column" fxLayoutGap="5px">
      <div fxLayout="row" fxLayoutGap="5px" fxLayoutAlign="start center">
        <nz-input-group [nzSuffix]="suffixIconSearch">
          <input type="text" nz-input placeholder="Search" [formControl]="entitySearchControl"/>
        </nz-input-group>
        <ng-template #suffixIconSearch>
          <i nz-icon nzType="search"></i>
        </ng-template>

        <div>
          <button nz-button nzType="primary" (click)="newSemanticNode()">
            <span>New</span>
          </button>
        </div>
      </div>

        <div cdkDropList
             id="entityList" [cdkDropListConnectedTo]="['canvasContainer']"
             [cdkDropListData]="semanticModelNodes"
             class="concept-list scroll-list"
             cdkDropListSortingDisabled>
          <div *ngFor="let element of semanticModelNodes" cdkDrag class="concept-box" nz-tooltip
               nzTooltipTitle="{{element.description}}" [cdkDragData]="element">
            <div fxLayout="row" fxLayoutAlign="start center" class="concept-box-label">{{ element.label }}
              <nz-tag class="named-entity-tag" *ngIf="element._class === 'NamedEntity'"
                      [nz-tooltip]="'A Named Entity represents a fixed entity and cannot be modified.'">NE
              </nz-tag>
            </div>
            <span class="concept-box-uri" nz-typography nzType="secondary">{{element.uri}}</span>
            <div *cdkDragPreview class="concept-preview"
                 [ngStyle]="{ border: '3px solid', 'border-color': 'black',  color: 'black'}">
              <div class="concept-preview-header" [ngStyle]="{ background: 'black', color: 'black' }">
                <span class="concept-preview-header-text">{{ element.label }}</span></div>
            </div>
          </div>
        </div>

    </div>
  </nz-tab>

  <nz-tab nzTitle="Relations">
    <div fxLayout="column" fxLayoutGap="5px">
      <div fxLayout="row" fxLayoutGap="5px" fxLayoutAlign="start center">
        <nz-input-group [nzSuffix]="suffixIconSearch">
          <input type="text" nz-input placeholder="Search" [formControl]="relationSearchControl"/>
        </nz-input-group>
        <ng-template #suffixIconSearch>
          <i nz-icon nzType="search"></i>
        </ng-template>

        <div>
          <button nz-button nzType="primary" (click)="newRelationConcept()">
            <span>New</span>
          </button>
        </div>
      </div>

      <ul nz-menu class="concept-list">
        <li *ngFor="let relation of relations; let i = index" nz-menu-item
            [value]="relation"
            (click)="toggleRelation(i, relation)"
            [ngStyle]="{'background': isSelected(relation) ? 'black' : null, 'color': isSelected(relation) ? 'white' : null}">
          <div fxLayout="row" fxLayoutAlign="space-between center">
            <div fxLayout="row" fxLayoutAlign="start center" >{{ relation.label }}
              <nz-tag class="datatype-property-tag" *ngIf="relation._class === 'DataProperty'"
                      [nz-tooltip]="'A DatatypeProperty extends a Class with a literal.'">DP
              </nz-tag>
            </div>
            <span nz-typography nzType="secondary">{{relation.uri}}</span>
          </div>
        </li>
      </ul>
    </div>
  </nz-tab>

</nz-tabset>
