<nz-card class="menu-card">
  <ul nz-menu nzSelectable>
    <li *ngIf="node" nz-menu-group nzTitle="Edit class">
      <ul>
        <li nz-menu-item nzDanger (click)="remove()"><i nz-icon nzType="delete"></i>Remove class</li>
      </ul>
    </li>
    <li nz-menu-divider></li>
    <li *ngIf="syntaxNode?.operations?.length > 0" nz-menu-group nzTitle="Syntactic Operations">
      <ul>
        <li nz-menu-item *ngFor="let operation of syntaxNode?.operations" (click)="onSelectOperation(operation)">{{ operation.label }}</li>
      </ul>
    </li>
  </ul>
</nz-card>
