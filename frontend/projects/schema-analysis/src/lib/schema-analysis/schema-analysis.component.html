<div class="mcontainer" fxLayout.lt-sm fxLayout="column" fxLayoutGap="10px" fxLayoutAlign="center start">

  <div class="loading-shade" *ngIf="initializing" fxLayout="column"> <!-- || error -->
    <mat-spinner *ngIf="initializing" [diameter]="50"></mat-spinner>
    <span *ngIf="initializing">Initializing data source</span>
    <div class="error" *ngIf="false"> <!-- ngIf = error -->
      <!-- add error functionality -->
    </div>
  </div>

  <div *ngIf="!initializing" fxLayout="column" fxLayoutGap="20px" fxFill>
    <mat-card>
      <mat-card-header>
        <mat-card-title>Add Data Samples</mat-card-title>
      </mat-card-header>
      <mat-card-content fxLayout="column" fxLayoutGap="10px">
        <textarea title="Data Point" cdkTextareaAutosize
                  [(ngModel)]="currentDataPoint"
                  name="description"
                  class="form-control"
                  cdkAutosizeMinRows="2"
                  cdkAutosizeMaxRows="10"
                  id="input-datapoint">
                </textarea>
        <div fxLayout="row" fxLayoutAlign="end">
          <button mat-stroked-button (click)="addLineSample()" [disabled]="!isValidJson()">
            <mat-icon>add</mat-icon>
            <span>Add Sample</span></button>
        </div>
        <div fxLayout="row" *ngFor="let dp of lastDataPoints; let i = index">
          <span style="margin-left: 20px; margin-bottom: 20px"> [{{i}}] </span>
          <span style="font-family: Consolas; margin-left: 20px">{{dp}}</span>
        </div>
      </mat-card-content>
    </mat-card>


    <div fxLayout="row" fxLayoutAlign="end">
      <button mat-raised-button color="primary" (click)="finish()">
        <mat-icon>stop</mat-icon>
        <span>Finish</span>
      </button>
    </div>
  </div>
</div>
