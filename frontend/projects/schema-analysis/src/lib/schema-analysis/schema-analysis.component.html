<div class="mcontainer" fxLayout.lt-sm fxLayout="column" fxLayoutGap="10px" fxLayoutAlign="center start">

  <div class="loading-shade" *ngIf="initializing" fxLayout="column">
    <mat-spinner *ngIf="!error" [diameter]="50"></mat-spinner>
    <span *ngIf="!error">Initializing data source</span>
    <mat-error *ngIf="error">
      {{ error }}
    </mat-error>
  </div>

  <div *ngIf="!initializing" fxLayout="column" fxLayoutGap="20px" fxFill>
    <mat-card>
      <mat-card-header>
        <mat-card-title>Add Data Samples</mat-card-title>
      </mat-card-header>
      <mat-card-content fxLayout="column" fxLayoutGap="10px">
        <textarea title="Data Point" cdkTextareaAutosize
                  [disabled]="isReady"
                  [(ngModel)]="currentDataPoint"
                  name="description"
                  class="form-control"
                  cdkAutosizeMinRows="2"
                  cdkAutosizeMaxRows="10"
                  id="input-datapoint">
                </textarea>
        <div fxLayout="row" fxLayoutAlign="end">
          <button mat-stroked-button (click)="addLineSample()" [disabled]="!isValidJson() || isReady">
            <mat-icon>add</mat-icon>
            <span>Add Sample</span></button>
        </div>
        <div fxLayout="row" *ngFor="let dp of lastDataPoints; let i = index">
          <span style="margin-left: 20px; margin-bottom: 20px"> [{{i}}] </span>
          <span style="font-family: Consolas monospace; margin-left: 20px">{{dp}}</span>
        </div>
      </mat-card-content>
    </mat-card>


    <div fxLayout="row" fxLayoutAlign="end">
      <pls-loading-button [loading]="loading" [color]="'primary'" [disabled]="isReady" (click)="finish()">
        <ng-container>
          <mat-icon *ngIf="!isReady">stop</mat-icon>
          <span *ngIf="!isReady">Finish</span>
        </ng-container>
        <ng-container>
          <mat-icon *ngIf="isReady">check</mat-icon>
          <span *ngIf="isReady">Ready</span>
        </ng-container>
      </pls-loading-button>
    </div>

    <pls-json-viewer *ngIf="result" [json]="result"></pls-json-viewer>
  </div>
</div>
