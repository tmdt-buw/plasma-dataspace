# ----------------------------------------
# Spring Boot Admin
# ----------------------------------------
logging.file.name=${plasma.logging.path}/${plasma.logging.all.file}.log
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
# ----------------------------------------
# Spring Docs
# ----------------------------------------
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api/${spring.application.name}/docs
springdoc.swagger-ui.path=/api/${spring.application.name}/swagger-ui
springdoc.swagger-ui.disable-swagger-default-url=true
# ----------------------------------------
# Spring
# ----------------------------------------
## General
spring.application.name=ars-l-lm
server.port=8190
server.error.whitelabel.enabled=false
# ----------------------------------------
# PLASMA
# ----------------------------------------
plasma.host_name=plasma-ars-l-lm
plasma.server_address=http://${plasma.host_name}:${server.port}/api/ars-l-lm
## Logging
plasma.logging.path=./logs/ars-l-lm_logs
plasma.logging.all.file=file_all
plasma.logging.all.level=INFO
plasma.config.local.path=/var/plasma/configs

plasma.kgs.ontology.api = http://localhost:8181/api/sms/ontologies

## upstream service for registration
plasma.registration.upstream.host=localhost
plasma.registration.upstream.port=8181
plasma.registration.interval=30000
plasma.registration.uri=/api/sms/ars/registration
