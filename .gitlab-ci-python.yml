ars-r-sr-dockerize:
  stage: docker_deploy
  tags:
    - docker
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [ "" ]
  before_script:
    - export MY_TAG=${CI_COMMIT_TAG#release-}
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --build-arg profile=production --context $CI_PROJECT_DIR/auxiliary_services/ARS-R-statistic-recommender --dockerfile $CI_PROJECT_DIR/auxiliary_services/ARS-R-statistic-recommender/Dockerfile --destination $CI_REGISTRY_IMAGE/ars-r-sr:$MY_TAG
  except: #equivalent to /^(?!release-).*$/ the longer version is needed since negative look-ahead is deactivated because of catastrophic backtracking
    - /^((.{0,7}$)|[^r]|.{1}[^e]|.{2}[^l]|.{3}[^e]|.{4}[^a]|.{5}[^s]|.{6}[^e]|.{7}[^-]).*$/
  dependencies:
    - ui-build
