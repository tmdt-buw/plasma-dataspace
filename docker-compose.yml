services:
########################### Infrastructure ######################################

  fuseki:
    image: saiye/fuseki:4.7.0
    hostname: fuseki
    restart: unless-stopped
    ports:
      - "3030:3030"
    networks:
      - plasma
    environment:
      - FUSEKI_DATASET_1=sm
      - FUSEKI_DATASET_2=ontologies
      - ADMIN_PASSWORD=plasma
    volumes:
      - fuseki_data:/fuseki

  mariadb-sms:
    image: mariadb:latest
    hostname: mariadb-sms
    restart: unless-stopped
    command: mariadbd --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_DATABASE=plasma-sms
      - MYSQL_ROOT_PASSWORD=plasma
    volumes:
      - mariadb_sms:/var/lib/mysql
    networks:
      - plasma
    healthcheck:
      test: bash -c "mariadb -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD  -e \"show databases;\""
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 5s
    ports:
      - "3306:3306"

########################### Services ######################################

  sms:
    image: "plasma/sms:${PLASMA_VERSION}"
    hostname: plasma-sms
    restart: unless-stopped
    volumes:
      - configs:/var/plasma/configs
      - kgs_ontologies:/var/ontologies
    depends_on:
      - mariadb-sms
      - fuseki
      - traefik
    profiles: [staging]
    ports:
      - "8181:8181"
    networks:
      - plasma
    environment:
      - plasma.sms.feature.recommendations.enabled=true
      - plasma.sms.feature.finalizemodels.enabled=true
      - plasma.kgs.ontologies.folder=/var/ontologies
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`localhost`) && PathPrefix(`/api/sms`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.app-https.middlewares=cors"
      - "traefik.http.middlewares.cors.headers.accesscontrolallowmethods=*"
      - "traefik.http.middlewares.cors.headers.accesscontrolalloworiginlist=*"
      - "traefik.http.middlewares.cors.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.cors.headers.addvaryheader=true"

  dps:
    image: "plasma/dps:${PLASMA_VERSION}"
    hostname: plasma-dps
    user: root
    restart: unless-stopped
    ports:
      - "8182:8182"
    networks:
      - plasma
    environment:
      - plasma.localstorage.directory=/var/plasma/localstorage
    volumes:
      - dps_storage:/var/plasma/localstorage
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`localhost`) && PathPrefix(`/api/dps`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.app-https.middlewares=cors"
      - "traefik.http.middlewares.cors.headers.accesscontrolallowmethods=*"
      - "traefik.http.middlewares.cors.headers.accesscontrolalloworiginlist=*"
      - "traefik.http.middlewares.cors.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.cors.headers.addvaryheader=true"

  frontend:
    build: ./frontend
    image: "plasma/ui:${PLASMA_VERSION}"
    hostname: plasma-ui
    restart: unless-stopped
    profiles: [staging]
    ports:
      - "81:80" # alternate access to running frontend, can be removed later
    depends_on:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`localhost`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
    networks:
      - plasma

########################### Auxiliary Services ######################################

  ars-l-lm:
    image: "plasma/ars-l-lm:${PLASMA_VERSION}"
    hostname: plasma-ars-l-lm
    restart: unless-stopped
    profiles: [staging]
    networks:
      - plasma
    volumes:
      - configs:/var/plasma/configs
    ports:
      - "8190:8190"

  ars-r-sr:
    build: ./auxiliary_services/ARS-R-statistic-recommender
    image: "plasma/ars-r-sr:${PLASMA_VERSION}"
    hostname: plasma-ars-r-sr
    restart: unless-stopped
    profiles: [staging]
    environment:
      - SERVICE_PORT=8221
      - SPARQL_SM_STORE=http://fuseki:3030/sm
      - SPARQL_ONTOLOGIES_STORE=http://fuseki:3030/ontologies
    depends_on:
      - fuseki
    volumes:
      - configs:/var/plasma/configs
    ports:
      - "8221:8221"

  ars-l-dsm:
    build: ./auxiliary_services/ARS-L-docsemmap
    image: "plasma/ars-l-dsm:${PLASMA_VERSION}"
    hostname: plasma-ars-l-dsm
    profiles: [staging]
    restart: unless-stopped
    environment:
      - SERVICE_PORT=8222
      - SMS_MODELINGS_ENDPOINT=http://sms:8181/api/plasma-sms/modelings
      - KGS_ONTOLGIES_ENDPOINT=http://kgs:8181/api/plasma-kgs/ontologies/nodes
    depends_on:
      - fuseki
    volumes:
      - configs:/var/plasma/configs
    ports:
      - "8222:8222"

########## PROXY ##########

  traefik:
    image: traefik:latest
    container_name: plasma-traefik
    ports:
      - "80:80"
    networks:
      - plasma
    command:
      - --api.dashboard=true
      - --log.level=INFO
      - --log.filepath=/var/log/traefik.log
      - --accesslog=true
      - --accesslog.filepath=/var/log/traefik-access.log
      - --providers.docker.network=proxy
      - --providers.docker.exposedByDefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entryPoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # remove next line when using Traefik v2
      - --entrypoints.websecure.asDefault=true
      - --entrypoints.websecure.http.tls.certresolver=myresolver
      - --certificatesresolvers.myresolver.acme.tlschallenge=true
      - --certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.myresolver.acme.email=paulus@crafting-systems.de
      - --certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json
    volumes:
      - ./traefik/log:/var/log
      - /var/run/docker.sock:/var/run/docker.sock


########## docker stuff ##########

volumes:
  fuseki_data:
  mariadb_sms:
  configs:
  kgs_ontologies:
  dps_storage:

networks:
  plasma:
    name: plasma
