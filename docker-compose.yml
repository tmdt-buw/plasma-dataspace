services:
########################### Infrastructure ######################################

  fuseki:
    image: saiye/fuseki:4.7.0
    hostname: fuseki
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      - FUSEKI_DATASET_1=sm
      - FUSEKI_DATASET_2=ontologies
      - ADMIN_PASSWORD=plasma
    volumes:
      - fuseki_data:/fuseki

  mariadb-sms:
    image: mariadb:latest
    hostname: mariadb-sms
    restart: unless-stopped
    command: mariadbd --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_DATABASE=plasma-sms
      - MYSQL_ROOT_PASSWORD=plasma
    volumes:
      - mariadb_sms:/var/lib/mysql
    healthcheck:
      test: bash -c "mariadb -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD  -e \"show databases;\""
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 5s
    ports:
      - "3306:3306"

  ########################### Service Infrastructure ######################################
  discovery:
    image: "plasma/discovery:${PLASMA_VERSION}"
    hostname: plasma-discovery-service
    restart: unless-stopped
    ports:
      - "8761:8761"

  gateway:
    image: "plasma/gateway:${PLASMA_VERSION}"
    hostname: plasma-gateway-service
    restart: unless-stopped
    depends_on:
      - discovery
    ports:
      - "8888:8888"

      ########################### Services ######################################

  kgs:
    image: "plasma/kgs:${PLASMA_VERSION}"
    hostname: plasma-kgs
    user: root
    restart: unless-stopped
    depends_on:
      - discovery
      - fuseki
    ports:
      - "8181:8181"
    environment:
      - plasma.kgs.ontologies.folder=/var/ontologies
    volumes:
      - kgs_ontologies:/var/ontologies

  sms:
    image: "plasma/sms:${PLASMA_VERSION}"
    hostname: plasma-sms
    restart: unless-stopped
    volumes:
      - configs:/var/plasma/configs
    depends_on:
      - discovery
      - gateway
      - mariadb-sms
    ports:
      - "8186:8186"
    environment:
      - plasma.sms.feature.recommendations.enabled=true
      - plasma.sms.feature.finalizemodels.enabled=true

  dps:
    image: "plasma/dps:${PLASMA_VERSION}"
    hostname: plasma-dps
    user: root
    restart: unless-stopped
    depends_on:
      - discovery
    ports:
      - "8193:8193"
    environment:
      - plasma.localstorage.directory=/var/plasma/localstorage
    volumes:
      - dps_storage:/var/plasma/localstorage

  srs:
    image: "plasma/srs:${PLASMA_VERSION}"
    hostname: plasma-srs
    restart: unless-stopped
    depends_on:
      - discovery   
    ports:
      - "8190:8190"
    environment:
      - plasma.ars.labeling.urls=http://plasma-ars-l-lm:8201/api/plasma-ars-l-lm
      - plasma.ars.modeling.url=
      - plasma.ars.refinement.urls=http://plasma-ars-r-sr:8221/recommendation

  frontend:
    build: ./frontend
    image: "plasma/ui:${PLASMA_VERSION}"
    hostname: plasma-ui
    restart: unless-stopped
    ports:
      - "80:80"

########################### Auxiliary Services ######################################

  ars-l-lm:
    image: "plasma/ars-l-lm:${PLASMA_VERSION}"
    hostname: plasma-ars-l-lm
    restart: unless-stopped
    depends_on:
      - discovery
      - kgs
    volumes:
      - configs:/var/plasma/configs
    ports:
      - "8201:8201"

  ars-r-sr:
    build: ./auxiliary_services/ARS-R-statistic-recommender
    image: "plasma/ars-r-sr:${PLASMA_VERSION}"
    hostname: plasma-ars-r-sr
    restart: unless-stopped
    environment:
      - SERVICE_PORT=8221
      - SPARQL_SM_STORE=http://fuseki:3030/sm
      - SPARQL_ONTOLOGIES_STORE=http://fuseki:3030/ontologies
    depends_on:
      - fuseki
    volumes:
      - configs:/var/plasma/configs
    ports:
      - "8221:8221"

  ars-l-dsm:
    build: ./auxiliary_services/ARS-L-docsemmap
    image: "plasma/ars-l-dsm:${PLASMA_VERSION}"
    hostname: plasma-ars-l-dsm
    restart: unless-stopped
    environment:
      - SERVICE_PORT=8222
      - SMS_MODELINGS_ENDPOINT=http://sms:8186/api/plasma-sms/modelings
      - KGS_ONTOLGIES_ENDPOINT=http://kgs:8181/api/plasma-kgs/ontologies/nodes
    depends_on:
      - fuseki
    volumes:
      - configs:/var/plasma/configs
    ports:
      - "8222:8222"


volumes:
  fuseki_data:
  mariadb_sms:
  configs:
  kgs_ontologies:
  dps_storage:
