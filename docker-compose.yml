# this is the local dev config
# This file starts the infrastructure services from docker-compose.local.yml but modifies the traefik config to
# support SMS and DPS and frontend to be run on the host machine.
#
# To start all services in a container locally use docker compose -f docker-compose.local.yml --profile staging up -d

services:
  ########################### Infrastructure ######################################

  fuseki:
    extends:
      service: fuseki
      file: docker-compose.local.yml

  mariadb-sms:
    extends:
      service: mariadb-sms
      file: docker-compose.local.yml

  ########## PROXY ##########

  traefik:
    extends:
      service: traefik
      file: docker-compose.local.yml
    command:
      - --api.dashboard=true
      - --log.level=DEBUG
      #- --log.filepath=/var/log/traefik.log
      - --accesslog=true
      #- --accesslog.filepath=/var/log/traefik-access.log
      - --providers.docker.network=plasma
      - --providers.docker.exposedByDefault=false
      - --entrypoints.web.address=:80
      #- --entrypoints.web.http.redirections.entrypoint.to=websecure
      #- --entryPoints.web.http.redirections.entrypoint.scheme=https
      #- --entrypoints.websecure.address=:443
      # remove next line when using Traefik v2
      #- --entrypoints.websecure.asDefault=true
      #- --entrypoints.websecure.http.tls.certresolver=myresolver
      #- --certificatesresolvers.myresolver.acme.tlschallenge=true
      #- --certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web
      #- --certificatesresolvers.myresolver.acme.email=paulus@crafting-systems.de
      #- --certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json

      # local config
      - --providers.file.filename=/dynamic.yml
      - --providers.file.watch=true

volumes:
  fuseki_data:
  mariadb_sms:
  configs:
  kgs_ontologies:
  dps_storage:

networks:
  plasma:
    name: plasma